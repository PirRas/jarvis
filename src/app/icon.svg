  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- feines Raster -->
  <g stroke="#46d5f5" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
  </g>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#46d5f5" stroke-opacity="0.3" stroke-width="2"/>
