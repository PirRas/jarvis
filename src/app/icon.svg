  <circle cx="256" cy="256" r="196" fill="none" stroke="#46d5f5" stroke-opacity="0.6" stroke-width="12" stroke-dasharray="2.4 14.70"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#46d5f5" stroke-width="20" stroke-dasharray="4 98.63"/>
