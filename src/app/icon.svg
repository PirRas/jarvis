    <circle cx="256" cy="256" r="128" fill="none" stroke="#f2b13d" stroke-width="6" stroke-linecap="round" stroke-dasharray="160 1000" transform="rotate(150 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="118" fill="url(#core)" stroke="#46d5f5" stroke-opacity="0.9" stroke-width="3"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#46d5f5" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="5 8"/>
